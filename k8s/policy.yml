apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: promptforge-network-policy
  namespace: promptforge-apps
spec:
  podSelector:
    matchLabels:
      status: busy
  policyTypes:
    - Ingress
    - Egress

    # Allow traffic from the promptforge-proxy pod to the busy pods
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: promptforge-proxy
      ports:
        - protocol: TCP
          port: 80
    # Allow traffic from the busy pods to any destination (egress)
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
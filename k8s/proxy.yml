apiVersion: apps/v1
kind: Deployment
metadata:
  name: promptforge-proxy
  namespace: promptforge-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promptforge-proxy
  template:
    metadata:
      labels:
        app: promptforge-proxy
    spec:
      containers:
        - name: proxy
          image: promptforge-proxy:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: REDIS_URL
              value: "redis://redis-service:6379"
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: promptforge-proxy-service
  namespace: promptforge-apps
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: promptforge-proxy
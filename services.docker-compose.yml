# docker compose -f services.docker-compose.yml up -> starts docker container
version: '3.9'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector-db-prompt-forge
    environment:
      POSTGRES_DB: testDB
      POSTGRES_USER: testUser
      POSTGRES_PASSWORD: password
    ports:
      - "9010:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    restart: unless-stopped


  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-prompt-forge
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    volumes:
      - minio-data:/data
    restart: unless-stopped
    depends_on:
      - pgvector

volumes:
  minio-data:
  pgvector-data:
